<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="brand">💰 Expense Tracker</h1>
      <p class="subtitle">Track your income and expenses in one place</p>

      <div class="tabs">
        <button type="button" class="tab active" id="loginTab">Login</button>
        <button type="button" class="tab" id="registerTab">Register</button>
      </div>

      <p id="message" class="message" hidden></p>

      <!-- Login form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-block">Login</button>
      </form>

      <!-- Register form -->
      <form id="registerForm" hidden>
        <div class="form-group">
          <label for="registerName">Full name</label>
          <input type="text" id="registerName" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="At least 6 characters"
            minlength="6"
            required
          />
        </div>
        <button type="submit" class="btn btn-block">Create account</button>
      </form>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
