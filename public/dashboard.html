<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-brand">💰 Expense Tracker</div>
      <div class="navbar-right">
        <span class="user-name" id="userName"></span>
        <button type="button" class="btn btn-outline btn-small" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="container">
      <!-- Summary cards -->
      <section class="cards">
        <div class="summary-card income">
          <div class="summary-label">Total Income</div>
          <div class="summary-value" id="totalIncome">Rs. 0.00</div>
        </div>
        <div class="summary-card expense">
          <div class="summary-label">Total Expenses</div>
          <div class="summary-value" id="totalExpense">Rs. 0.00</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Balance</div>
          <div class="summary-value" id="balance">Rs. 0.00</div>
        </div>
      </section>

            <!-- Charts -->
      <section class="charts">
        <div class="panel">
          <h2>Expenses by Category</h2>
          <div class="chart-box">
            <canvas id="categoryChart"></canvas>
            <p id="categoryEmpty" class="empty-state" hidden>No expense data to display</p>
          </div>
        </div>

        <div class="panel">
          <h2>Monthly Income vs Expenses</h2>
          <div class="chart-box">
            <canvas id="monthlyChart"></canvas>
            <p id="monthlyEmpty" class="empty-state" hidden>No data to display</p>
          </div>
        </div>
      </section>

      <div class="layout">
        <!-- Add / edit transaction form -->
        <section class="panel">
          <h2 id="formTitle">Add Transaction</h2>
          <p id="formMessage" class="message" hidden></p>

          <form id="transactionForm">
            <div class="form-group">
              <label for="type">Type</label>
              <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <input type="text" id="category" list="categoryList" placeholder="e.g. Food" required />
              <datalist id="categoryList">
                <option value="Salary"></option>
                <option value="Food"></option>
                <option value="Transport"></option>
                <option value="Bills"></option>
                <option value="Shopping"></option>
                <option value="Health"></option>
                <option value="Entertainment"></option>
              </datalist>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>

            <div class="form-group">
              <label for="note">Note (optional)</label>
              <textarea id="note" rows="2" placeholder="Short description"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn" id="submitBtn">Add</button>
              <button type="button" class="btn btn-secondary" id="cancelEditBtn" hidden>Cancel</button>
            </div>
          </form>
        </section>

        <!-- Transactions list -->
        <section class="panel">
          <h2>Transactions</h2>

          <div class="filters">
            <select id="filterType">
              <option value="">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <input type="date" id="filterFrom" title="From date" />
            <input type="date" id="filterTo" title="To date" />
            <button type="button" class="btn btn-secondary btn-small" id="clearFiltersBtn">Clear</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th>Note</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="transactionsBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

        <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
